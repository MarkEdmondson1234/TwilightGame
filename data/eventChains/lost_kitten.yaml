# The Lost Kitten
# A small discovery chain: a stray kitten turns up by the village well and the
# player decides its fate. Adopted, it moves into the upstairs bedroom; let go,
# it slips away into the bushes. The kitten NPCs read the recorded outcome
# (data/questHandlers/lostKittenHandler.ts) to decide where they appear.

id: lost_kitten
title: The Lost Kitten
description: A tiny kitten has been spotted near the village, mewing softly.
type: discovery

trigger:
  type: tile
  mapId: village
  tileX: 21
  tileY: 18
  radius: 2

stages:
  - id: found
    text: A tiny calico kitten is spotted near the village well, mewing softly and looking lost.
    event:
      title: Lost kitten spotted
      description: noticed a tiny calico kitten mewing near the village well
      contributor: A kind-hearted villager
    dialogue:
      kitten:
        text: "Mew! The kitten mews softly, blinking one blue eye and one green."
      village_elder:
        text: "Have you seen that little kitten by the well? Poor wee thing looks lost. Someone ought to help."
        expression: thinky
      mum:
        text: "Oh, that poor little kitten! It must be hungry. Someone should look after it."
    choices:
      - text: "I'll take the kitten home"
        next: adopt
      - text: "Let's ask if anyone's lost a cat"
        next: search_owner
        event:
          title: Search for kitten's owner
          description: started asking around the village about the lost kitten
          contributor: A thoughtful neighbour

  - id: search_owner
    text: You ask around the village, but nobody has lost a cat. The kitten seems to have appeared from nowhere.
    dialogue:
      kitten:
        text: "Mew? The kitten tilts its head, wondering what all the asking around is about."
      village_elder:
        text: "Nobody's lost a cat, you say? How peculiar. Perhaps it wandered from far away."
    choices:
      - text: "I'll look after it then"
        next: adopt
      - text: "Maybe it's a forest cat — it should stay free"
        next: let_go

  - id: adopt
    text: You scoop up the tiny kitten. It purrs all the way home, and you settle it in your bedroom upstairs.
    event:
      title: Kitten adopted
      description: gave the lost kitten a warm, loving home
      contributor: A new cat parent
    choices:
      - text: "Welcome home, little one"
        next: home

  - id: let_go
    text: The kitten blinks at you, then slips away between the bushes and is gone. You hope it'll be okay.
    choices:
      - text: "Goodbye, little one"
        next: farewell

  - id: home
    text: The kitten has a home of its own now, curled up in your bedroom upstairs.
    end: true

  - id: farewell
    text: The kitten has gone back to the wild, wherever it came from.
    end: true
