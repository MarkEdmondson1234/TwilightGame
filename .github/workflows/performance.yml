name: Performance Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # "Comment on PR" step posts/updates the performance report

jobs:
  performance:
    runs-on: ubuntu-latest
    # One browser session for every map (boot once, teleport between them):
    # ~3 min on a normal runner. Each map's measurement waits for frames rather
    # than seconds, so a slow runner takes longer rather than producing nothing;
    # the caps in scripts/perf-ci.mjs bound it at ~1.5 min per map.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Start dev server
        run: |
          npm run dev &
          # Wait for server to be ready
          npx wait-on http://localhost:4000/TwilightGame/ --timeout 60000

      # One browser session, every map in perf/budgets.json, each measured
      # against a ceiling committed in that file. Writes perf-report.md and
      # perf-results.json; exits 1 on a breach. `|| true` so the report is still
      # posted and uploaded — the final step turns the breach into the failure.
      - name: Measure against budgets
        run: node scripts/perf-ci.mjs || true

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('perf-report.md', 'utf8');

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('## Performance Test Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report,
              });
            }

      - name: Upload results as artifact
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: |
            perf-results.json
            perf-report.md
          retention-days: 30

      # What this gates on: scene cost at rest (sprites, nodes, textures,
      # texture MB, filter and mask passes) and work rates while walking (App
      # renders/s, scene rebuilds/s, NPC draws/frame, save flushes/min), each
      # against the ceiling in perf/budgets.json. Frame rate is recorded and
      # never gates: CI has no GPU and this game is GPU render-bound — four
      # main-branch runs of identical code once spanned 1.4 to 49.6 fps.
      - name: Check for regressions
        run: |
          if [ -f regression-detected ]; then
            echo "::error::Over the performance budget — see the rows marked OVER in the PR comment, and perf/budgets.json."
            exit 1
          fi
