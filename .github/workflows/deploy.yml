name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Deploy when pushing to main branch

  pull_request:
    branches:
      - main  # Verify (but do not deploy) every PR targeting main

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent run per ref.
#
# The group MUST stay ref-scoped. It used to be a single global "pages" group, which meant
# merging anything to main started main's deploy and cancelled the in-flight run on every
# open PR — killing the `verify` job below mid-`npm ci`. GitHub reports that cancellation as
# a failed check, indistinguishable at a glance from a real test failure, so PRs looked
# broken when nothing was wrong with them.
#
# Only main deploys (build and deploy are gated on github.event_name != 'pull_request'), so
# scoping by ref still serialises the actual Pages deployments against each other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate: types, lint and the full test suite must pass before anything is built or
  # deployed. Without this, the 400+ tests protect only local development — a broken
  # test (or a lint error) would ship straight to production. eslint exits non-zero on
  # errors only, so the 200+ existing warnings do not block; introduce an error and it does.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --ext .ts,.tsx

      - name: Test
        run: npm run test:run

  build:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # scripts/optimize-assets.js runs as a prebuild step and pipes GIFs through
      # gifsicle, falling back to copying them verbatim when it is absent. The
      # runner had no gifsicle, so every deploy regenerated the GIFs uncompressed
      # and overwrote the optimised files committed in the repo — the build warned
      # about it in the log and shipped anyway. Without this the optimisation
      # exists everywhere except the one place it matters.
      - name: Install gifsicle
        run: sudo apt-get update && sudo apt-get install -y gifsicle

      - name: Build
        env:
          # Firebase client config (public - embedded in browser JS)
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: twiightgame.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: twiightgame
          VITE_FIREBASE_STORAGE_BUCKET: twiightgame.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Realtime Database URL for multiplayer presence. Unset until the
          # VITE_FIREBASE_DATABASE_URL secret is added - firebase/realtimeConfig.ts
          # no-ops without it and the game runs exactly as single-player.
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          # Error reporting (public - embedded in browser JS, like the Firebase config above).
          # Unset until the VITE_SENTRY_DSN secret is added — errorReporting.ts no-ops without it.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Tags Sentry errors with the commit that shipped them.
          VITE_APP_VERSION: ${{ github.sha }}
          # Uploads source maps so production stack traces are readable rather
          # than minified. NOT public and deliberately un-prefixed: a VITE_ name
          # would embed this write-capable token in the browser bundle. Unset
          # until the SENTRY_AUTH_TOKEN secret is added — vite.config.ts leaves
          # the plugin out entirely without it, so the build still succeeds.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
